name: NADMO Public Sales Funnel QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'worker-public.js'
      - 'scripts/qa-public.mjs'
      - '.github/workflows/public-sales-funnel-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check worker-public.js
          node --check site/app.js
          node --check site/checkout.js
          node --check scripts/qa-public.mjs
      - name: Install pinned browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify customer journey in Chrome-compatible browser
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/nadmo-site.log 2>&1 &
          SITE_PID=$!
          trap 'kill "${SITE_PID}" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          QA_BASE_URL=http://127.0.0.1:8765/ node scripts/qa-public.mjs
