<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>AM DIGITAL LAB — CRM v0.3.0</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="login" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">AM</div>
      <h1>AM DIGITAL LAB</h1>
      <p>CRM & Internal Dashboard <span class="version">v0.3.0</span></p>
      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" value="admin@amdigital.local" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Masuk ke Dashboard</button>
        <div id="loginError" class="error"></div>
      </form>
      <small>Cloudflare production build · Workers + D1. Password disimpan sebagai Worker secret, tidak pernah ditanam di source code.</small>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">AM</span><div><b>AM DIGITAL LAB</b><span>Internal CRM · Cloudflare</span></div></div>
      <nav id="nav">
        <button data-page="dashboard" class="active">Dashboard</button>
        <button data-page="leads">Sales / Leads</button>
        <button data-page="clients">Clients</button>
        <button data-page="projects">Projects</button>
        <button data-page="quotations">Quotations</button>
        <button data-page="tasks">Tasks</button>
        <button data-page="changes">Change Requests</button>
        <button data-page="qc">QC / Bugs</button>
        <button data-page="finance">Finance</button>
      </nav>
      <div class="side-bottom"><span id="userName"></span><button id="logoutBtn">Logout</button></div>
    </aside>

    <main>
      <header class="topbar">
        <div><h2 id="pageTitle">Dashboard</h2><p id="pageSub">Kontrol operasional AM DIGITAL LAB.</p></div>
        <button id="quickAdd" class="primary">+ New Lead</button>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-head"><div><h3 id="modalTitle"></h3><p id="modalSub"></p></div><button value="cancel" class="icon-btn">×</button></div>
      <div id="modalBody" class="form-grid"></div>
      <div class="modal-actions"><button value="cancel" class="ghost">Batal</button><button id="modalSave" value="default" class="primary">Simpan</button></div>
    </form>
  </dialog>
  <script src="/core.js"></script>
  <script src="/pages-core.js"></script>
  <script src="/pages-ops.js"></script>
  <script src="/modals.js"></script>
</body>
</html>
